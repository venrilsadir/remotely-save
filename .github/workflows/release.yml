# Build and publish a GitHub Release whenever a tag is pushed.
#
#   git tag 0.5.26          # or v0.5.26, the leading "v" is stripped
#   git push origin 0.5.26
#
# The version baked into manifest.json / manifest-beta.json / package.json is
# taken from the tag itself, so the released assets always agree with the tag
# (Obsidian and BRAT both require manifest.version == release tag).

name: Release A New Version

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. 0.5.26"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DROPBOX_APP_KEY: ${{secrets.DROPBOX_APP_KEY}}
      ONEDRIVE_CLIENT_ID: ${{secrets.ONEDRIVE_CLIENT_ID}}
      ONEDRIVE_AUTHORITY: ${{secrets.ONEDRIVE_AUTHORITY}}
      REMOTELYSAVE_WEBSITE: ${{secrets.REMOTELYSAVE_WEBSITE}}
      REMOTELYSAVE_CLIENT_ID: ${{secrets.REMOTELYSAVE_CLIENT_ID}}
      GOOGLEDRIVE_CLIENT_ID: ${{secrets.GOOGLEDRIVE_CLIENT_ID}}
      GOOGLEDRIVE_CLIENT_SECRET: ${{secrets.GOOGLEDRIVE_CLIENT_SECRET}}
      BOX_CLIENT_ID: ${{secrets.BOX_CLIENT_ID}}
      BOX_CLIENT_SECRET: ${{secrets.BOX_CLIENT_SECRET}}
      PCLOUD_CLIENT_ID: ${{secrets.PCLOUD_CLIENT_ID}}
      PCLOUD_CLIENT_SECRET: ${{secrets.PCLOUD_CLIENT_SECRET}}
      YANDEXDISK_CLIENT_ID: ${{secrets.YANDEXDISK_CLIENT_ID}}
      YANDEXDISK_CLIENT_SECRET: ${{secrets.YANDEXDISK_CLIENT_SECRET}}
      KOOFR_CLIENT_ID: ${{secrets.KOOFR_CLIENT_ID}}
      KOOFR_CLIENT_SECRET: ${{secrets.KOOFR_CLIENT_SECRET}}

    steps:
      - name: Resolve tag and version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing tag=$TAG as version=$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout codes
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}
          submodules: recursive
          # the repo keeps svg/png/pdf in LFS and webpack inlines the svg files,
          # so unresolved pointers would silently end up inside main.js
          lfs: true

      - name: Report which OAuth keys are baked in
        run: |
          # webpack.DefinePlugin inlines these into main.js at build time; there is
          # no settings field for them. An existing install is unaffected because
          # the client id it authenticated with is kept in its own data.json and
          # main.ts only refills an *empty* one from the build-time default.
          # A missing key therefore only breaks a fresh install or a re-auth,
          # which is a warning, not a reason to refuse to publish.
          missing=""
          for name in DROPBOX_APP_KEY ONEDRIVE_CLIENT_ID ONEDRIVE_AUTHORITY GOOGLEDRIVE_CLIENT_ID GOOGLEDRIVE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
              echo "::warning::Secret $name is not set: a fresh install cannot authenticate that service."
            fi
          done
          if [ -n "$missing" ]; then
            {
              echo "### Missing OAuth secrets"
              echo
              echo "Not set:$missing"
              echo
              echo "Already-authenticated vaults keep working, the client id lives in their own data.json."
              echo "Fresh installs and re-auths of those services will fail."
              echo "Add them under Settings > Secrets and variables > Actions if that matters."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All OAuth secrets are set." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Sync the version of the manifests with the tag
        run: |
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            for (const f of ["manifest.json", "manifest-beta.json", "package.json"]) {
              if (!fs.existsSync(f)) continue;
              const j = JSON.parse(fs.readFileSync(f, "utf-8"));
              j.version = version;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
              console.log(`${f} -> ${version}`);
            }
          ' "${{ steps.ver.outputs.version }}"

      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Check the build output
        run: |
          # webpack is configured with LimitChunkCountPlugin(maxChunks: 1) because
          # Obsidian mobile can only load a single main.js; a stray chunk here means
          # the mobile build would be broken.
          test -f main.js
          if ls [0-9]*.main.js >/dev/null 2>&1; then
            echo "::error::extra webpack chunks were emitted, mobile would fail to load the plugin"
            exit 1
          fi
          SIZE=$(wc -c < main.js)
          echo "main.js is $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          test "$SIZE" -gt 1000000

      - name: Pack a zip for manual installation
        run: |
          mkdir -p dist/remotely-save
          cp main.js manifest.json styles.css dist/remotely-save/
          (cd dist && zip -r "../remotely-save-${{ steps.ver.outputs.version }}.zip" remotely-save)

      - name: Create Release And Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: |
            main.js
            manifest.json
            styles.css
            remotely-save-${{ steps.ver.outputs.version }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
